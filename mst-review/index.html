<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Med-Surg/Tele Question Bank · SME Review</title>
<style>
:root{--bg:#f6f4f1;--card:#fff;--ink:#1d1f24;--mute:#6b7080;--line:#e3e0da;--card2:#faf9f7;--red:#990000;--gold:#c99700;--ok:#1d8a4e;--okbg:#e8f5ee;--warn:#b26a00;--warnbg:#fff4e0;--bad:#c0392b;--badbg:#fdecea;--blue:#2a5bd7}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;color:var(--ink)}
button.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}button.ghost{background:transparent}button:disabled{opacity:.45;cursor:default}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;width:100%}textarea{min-height:70px;resize:vertical}
header{background:#1d1f24;color:#fff;padding:10px 18px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;font-weight:700}header h1 span{color:#ffcc00}
nav{display:flex;gap:4px;margin-left:12px}nav button{background:transparent;color:#cfd3dc;border:0;padding:6px 12px}nav button.on{background:#ffffff1f;color:#fff;font-weight:600}
.who{margin-left:auto;font-size:13px;color:#cfd3dc;display:flex;gap:12px;align-items:center}.prog{width:140px;height:8px;background:#ffffff26;border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:#ffcc00}
.gate{max-width:520px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px}
.gate h2{margin:0 0 6px}.gate label{display:block;margin:12px 0 4px;font-size:13px;color:var(--mute);font-weight:600}
.wrap{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 50px)}
.side{border-right:1px solid var(--line);background:var(--card2);display:flex;flex-direction:column;min-height:0}
.filters{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px;border-bottom:1px solid var(--line)}.filters .full{grid-column:1/-1}
.list{overflow:auto;flex:1}.row{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:86px 1fr auto;gap:8px;align-items:start}
.row:hover{background:#fff}.row.sel{background:#fff;box-shadow:inset 4px 0 0 var(--red)}.row .id{font-weight:700;font-size:13px}.row .t{font-size:13px;color:var(--mute);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .ic{font-size:12px;white-space:nowrap;text-align:right}.cnt{padding:6px 12px;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line)}
.main{overflow:auto;padding:18px 22px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chip{font-size:12px;border-radius:999px;padding:2px 9px;background:#eef0f4;color:#3b4252}.chip.k{background:#fde8e8;color:var(--red);font-weight:700}.chip.src{background:#fff4d6;color:#7a5a00}
.stem{font-size:18px;font-weight:600;margin:4px 0 12px}
.opt{display:grid;grid-template-columns:26px 1fr auto;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin:6px 0}.opt b{color:var(--red)}
.opt.key{border-color:var(--ok);background:var(--okbg)}.opt .lure{grid-column:2/-1;font-size:13px;color:var(--mute);margin-top:2px}.opt .cr{font-size:12px;font-weight:700;color:var(--ok)}
.why{background:var(--okbg);border-left:4px solid var(--ok);padding:10px 12px;border-radius:8px;margin-top:10px}
.part{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px}.part h4{margin:0 0 4px;font-size:14px;color:var(--mute)}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 10px}.seg button{padding:4px 10px;font-size:13px}.seg button.on{background:#1d1f24;color:#fff;border-color:#1d1f24}
.dec button.on[data-v=approve]{background:var(--ok);border-color:var(--ok)}.dec button.on[data-v=minor]{background:#4f9a6c;border-color:#4f9a6c}.dec button.on[data-v=revise]{background:var(--warn);border-color:var(--warn)}.dec button.on[data-v=reject]{background:var(--bad);border-color:var(--bad)}
.lbl{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.4px;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.edit{background:#f3f6fd;border:1px solid #d6e0f7;border-radius:10px;padding:12px;margin-top:8px}.edit .r{display:grid;grid-template-columns:28px 1fr;gap:6px;align-items:start;margin:5px 0}
.rev{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--card2)}.rev .h{display:flex;gap:8px;align-items:center;font-size:13px}.rev .h b{font-size:14px}
.pill{font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px}.p-approve{background:var(--okbg);color:var(--ok)}.p-minor{background:#e6f2ea;color:#3d7a54}.p-revise{background:var(--warnbg);color:var(--warn)}.p-reject{background:var(--badbg);color:var(--bad)}
.diff{font-size:13px;margin-top:6px}.diff del{color:var(--bad)}.diff ins{color:var(--ok);text-decoration:none;font-weight:600}
.savebar{display:flex;gap:8px;align-items:center;margin-top:12px}.saved{color:var(--ok);font-size:13px;font-weight:600}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{background:var(--card2);position:sticky;top:0}
.stat{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 8px 8px 0}.stat b{display:block;font-size:22px}
.muted{color:var(--mute)}.small{font-size:13px}.err{color:var(--bad);font-size:13px;margin-top:8px}
.toast{position:fixed;bottom:18px;right:18px;background:#1d1f24;color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:9}
@media(max-width:900px){.wrap{grid-template-columns:1fr;height:auto}.side{max-height:45vh}.grid2{grid-template-columns:1fr}}
</style>
</head>

const $=s=>document.querySelector(s);const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",2400);}
async function rpc(fn,args){const r=await fetch(CFG.url+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:CFG.key,Authorization:"Bearer "+CFG.key,"Content-Type":"application/json"},body:JSON.stringify(args)});const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){j=t}if(!r.ok)throw new Error((j&&j.message)||("HTTP "+r.status));return j;}
async function decrypt(code){const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(BLOB.salt),iterations:BLOB.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(BLOB.iv)},k,b(BLOB.ct));return JSON.parse(new TextDecoder().decode(pt));}
function save(){try{localStorage.setItem("mst_sme",JSON.stringify({ME,CODE}))}catch(e){}}
function load(){try{const j=JSON.parse(localStorage.getItem("mst_sme")||"null");if(j){ME=j.ME;CODE=j.CODE}}catch(e){}}
// ───────── gate ─────────
function vGate(err){$("#nav").innerHTML="";$("#who").innerHTML="";
 $("#app").innerHTML=`<div class="gate"><h2>Question bank review</h2><p class="muted">Med-Surg Tele &amp; Progressive Care new-graduate bank, aligned to AKAT (PCU track), PCCN and CMSRN, with hands-on skill stations scored on the Lasater Clinical Judgment Rubric phases. Review items, suggest edits, and propose new topics. Reviews are shared with the other reviewers.</p>
 <label>Review code (from Scott)</label><input id="gc" value="${esc(PRE.c||CODE||"")}" autocomplete="off">
 <label>Your name</label><input id="gn" value="${esc(PRE.n||(ME?ME.name:""))}" placeholder="First Last">
 <label>Your email</label><input id="ge" value="${esc(PRE.e||(ME?ME.email:""))}" placeholder="name@med.usc.edu">
 ${err?`<div class="err">${esc(err)}</div>`:""}<div style="margin-top:16px"><button class="pri" id="gb">Start reviewing</button></div>
 <p class="small muted" style="margin-top:14px">Your name and email identify your reviews so your edits are saved as yours. Use the same email on any computer to pick up where you left off.</p></div>`;
 $("#gb").onclick=async()=>{const c=$("#gc").value.trim(),n=$("#gn").value.trim(),e=$("#ge").value.trim().toLowerCase();PRE={c,n,e};
  if(!c||!n||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))return vGate("Enter the review code, your name, and a valid email.");
  $("#gb").disabled=true;$("#gb").textContent="Unlocking…";
  try{BANK=await decrypt(c)}catch(x){return vGate("That review code didn't work.")}
  CODE=c;ME={name:n,email:e};save();await refresh();go("review");};
}
async function refresh(){try{REV=await rpc("mst_rev_all",{p_code:CODE})||[];SUG=await rpc("mst_sugg_all",{p_code:CODE})||[]}catch(e){toast("Couldn't reach the server: "+e.message)}}

function go(v){VIEW=v;nav();({review:vReview,suggest:vSuggest,summary:vSummary})[v]();}

 document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.v));
 const mine=new Set(REV.filter(r=>r.email===ME.email).map(r=>r.item));const n=BANK.length,m=BANK.filter(b=>mine.has(b.id)).length;
 $("#who").innerHTML=`<span>${esc(ME.name)}</span><span>${m}/${n} reviewed</span><span class="prog"><i style="width:${Math.round(m/n*100)}%"></i></span><button class="ghost" style="color:#cfd3dc;border-color:#ffffff33;padding:3px 9px" id="out">Switch</button>`;
 $("#out").onclick=()=>{vGate()};}
const revFor=id=>REV.filter(r=>r.item===id);
const mineFor=id=>REV.find(r=>r.item===id&&r.email===ME.email);
function title(b){const d=b.data;return b.kind==="item"?d.stem:b.kind==="case"?d.title+": "+d.intro:d.topic_reveal+": "+d.task;}
function areaOf(b){return b.data.area||""}

function filtered(){return BANK.filter(b=>{if(FILT.kind&&b.kind!==FILT.kind)return false;if(FILT.batch&&String(b.batch)!==FILT.batch)return false;if(FILT.area&&areaOf(b)!==FILT.area)return false;if(FILT.unit&&b.data.unit!==FILT.unit)return false;
 const rs=revFor(b.id),me=mineFor(b.id);
 if(FILT.status==="todo"&&me)return false;if(FILT.status==="done"&&!me)return false;if(FILT.status==="comments"&&!rs.some(r=>r.email!==ME.email))return false;
 if(FILT.status==="attention"&&!rs.some(r=>["revise","reject"].includes(r.p.decision)||r.p.accurate==="No"))return false;
 if(FILT.q){const q=FILT.q.toLowerCase();if(!(b.id.toLowerCase().includes(q)||JSON.stringify(b.data).toLowerCase().includes(q)))return false}return true;});}

 $("#app").innerHTML=`<div class="wrap"><div class="side"><div class="filters">

 [["fk","kind"],["fb","batch"],["fu","unit"],["fa","area"],["fs","status"]].forEach(([id,k])=>{const el=$("#"+id);el.value=FILT[k];el.onchange=()=>{FILT[k]=el.value;list()}});
 const q=$("#fq");q.value=FILT.q;q.oninput=()=>{FILT.q=q.value;list()};

function list(){const F=filtered();$("#cnt").textContent=`${F.length} shown`;
 $("#list").innerHTML=F.map(b=>{const rs=revFor(b.id),me=mineFor(b.id),others=rs.filter(r=>r.email!==ME.email).length,att=rs.some(r=>["revise","reject"].includes(r.p.decision));
  return `<div class="row ${SEL===b.id?"sel":""}" data-id="${b.id}"><div class="id">${b.id}<div class="muted" style="font-weight:400;font-size:11px">B${b.batch}</div></div><div class="t">${esc(title(b))}</div>
  <div class="ic">${me?`<span class="pill p-${me.p.decision||"approve"}">${({approve:"✓",minor:"✓·",revise:"✎",reject:"✕"})[me.p.decision]||"•"}</span>`:""}${others?` 💬${others}`:""}${att?" ⚠":""}</div></div>`}).join("")||`<p class="muted" style="padding:12px">Nothing matches these filters.</p>`;
 document.querySelectorAll(".row").forEach(r=>r.onclick=()=>{SEL=r.dataset.id;DRAFT=null;list();show();$("#main").scrollTop=0});}
function optBlock(d,showKey=true){return d.opts.map((o,i)=>{const Lt=L[i],isKey=String(d.key).split(",").includes(Lt);
 const cr=d.credit&&d.credit[Lt]!=null?`<span class="cr">${Math.round(d.credit[Lt]*100)}%</span>`:"";
 return `<div class="opt ${isKey?"key":""}"><b>${Lt}</b><div>${esc(o)}</div>${cr}${!isKey&&d.lure&&d.lure[Lt]?`<div class="lure">Why tempting: ${esc(d.lure[Lt])}</div>`:""}</div>`}).join("")+`<div class="why"><b>Key ${esc(d.key)}.</b> ${esc(d.why)}</div>`;}
function renderBody(b){const d=b.data;
 if(b.kind==="item")return `<div class="chips"><span class="chip k">${b.id}</span><span class="chip">${esc(d.area)}</span><span class="chip">ECCO ${esc(d.ecco)}</span><span class="chip">${esc(d.unit)}</span><span class="chip">${esc(d.level)}</span><span class="chip">${esc(d.type)}</span><span class="chip">${esc(d.cog)}</span>${d.pccn?`<span class="chip">PCCN: ${esc(d.pccn)}</span>`:""}${d.cmsrn?`<span class="chip">CMSRN: ${esc(d.cmsrn)}</span>`:""}<span class="chip">Batch ${b.batch}</span>${d.src&&d.src!=="New"?`<span class="chip src">${esc(d.src)}</span>`:""}</div>
  <div class="stem">${esc(d.stem)}</div>${optBlock(d)}`;
 if(b.kind==="case")return `<div class="chips"><span class="chip k">${b.id}</span><span class="chip">✨ Unfolding case</span><span class="chip">${esc(d.area)}</span><span class="chip">ECCO ${esc(d.ecco)}</span><span class="chip">${esc(d.unit)}</span></div>
  <div class="stem">${esc(d.title)}</div><p>${esc(d.intro)}</p>${d.parts.map((p,i)=>`<div class="part"><h4>Part ${i+1} · ${esc(p.time)}</h4><div style="font-weight:600;margin-bottom:6px">${esc(p.stem)}</div>${optBlock(p)}</div>`).join("")}${d.debrief?`<p class="small" style="margin-top:12px"><b>Debrief:</b> ${esc(d.debrief)}</p>`:""}`;
 return `<div class="chips"><span class="chip k">${b.id}</span><span class="chip">🔧 Skill station (LCJR-scored)</span><span class="chip">${esc(d.area)}</span>${d.unit?`<span class="chip">${esc(d.unit)}</span>`:""}<span class="chip">ECCO ${esc(d.ecco)}</span></div>
  <div class="stem">Topic shown first: ${esc(d.topic_reveal)}</div><div class="grid2"><div><div class="lbl">Equipment</div>${esc(d.equipment)}</div><div><div class="lbl">Task (rep sees)</div>${esc(d.task)}</div>
  <div><div class="lbl">Faculty setup / data card</div>${esc(d.task_card)}</div><div><div class="lbl">Expected result</div>${esc(d.answer)}</div></div>
  <div class="lbl" style="margin-top:12px">Hidden rubric (Lasater phases)</div><ul>${d.rubric.map(r=>`<li>${esc(r)}</li>`).join("")}</ul><div class="lbl">Critical fails (task = 0)</div><ul>${d.critical.map(r=>`<li>⛔ ${esc(r)}</li>`).join("")}</ul>
  <div class="lbl">Room "predict it"</div>${esc(d.predict)}`;}
const CHECKS=[["accurate","Clinically accurate?",["Yes","Unsure","No"]],["keck","Matches Keck practice?",["Yes","Unsure","No","N/A"]],["difficulty","Difficulty for residents",["Too easy","About right","Too hard"]],["distractors","Wrong answers plausible?",["Yes","Some","No"]]];
function blankDraft(b){const me=mineFor(b.id);if(me)return JSON.parse(JSON.stringify(me.p));return {decision:"",accurate:"",keck:"",difficulty:"",distractors:"",comment:"",edit:null};}
function editFields(b){const d=b.data;
 if(b.kind==="item")return {stem:d.stem,opts:d.opts.slice(),key:d.key,why:d.why};
 if(b.kind==="case")return {text:""};return {rubric:d.rubric.join("\n"),critical:d.critical.join("\n"),task:d.task};}
function show(){const b=BANK.find(x=>x.id===SEL);const M=$("#main");if(!b){M.innerHTML=`<p class="muted">Pick an item on the left.</p>`;return}
 if(!DRAFT||DRAFT._id!==b.id){DRAFT=blankDraft(b);DRAFT._id=b.id}
 const others=revFor(b.id).filter(r=>r.email!==ME.email);
 const seg=(k,opts)=>`<div class="seg" data-k="${k}">${opts.map(o=>`<button class="${DRAFT[k]===o?"on":""}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
 const ed=DRAFT.edit;
 let edHtml="";if(ed){if(b.kind==="item")edHtml=`<div class="edit"><div class="lbl">Suggested edit (only change what you'd change)</div><div class="r"><span class="small muted">Stem</span><textarea data-e="stem">${esc(ed.stem)}</textarea></div>
  ${ed.opts.map((o,i)=>`<div class="r"><b>${L[i]}</b><input data-e="opt" data-i="${i}" value="${esc(o)}"></div>`).join("")}
  <div class="r"><span class="small muted">Key</span><input data-e="key" value="${esc(ed.key)}" style="max-width:120px"></div><div class="r"><span class="small muted">Why</span><textarea data-e="why">${esc(ed.why)}</textarea></div></div>`;
  else if(b.kind==="case")edHtml=`<div class="edit"><div class="lbl">Suggested rewrite (say which part and what to change)</div><textarea data-e="text" style="min-height:120px">${esc(ed.text)}</textarea></div>`;
  else edHtml=`<div class="edit"><div class="lbl">Suggested edit</div><div class="small muted">Task (rep sees)</div><textarea data-e="task">${esc(ed.task)}</textarea><div class="small muted">Rubric steps (one per line)</div><textarea data-e="rubric" style="min-height:120px">${esc(ed.rubric)}</textarea><div class="small muted">Critical fails (one per line)</div><textarea data-e="critical">${esc(ed.critical)}</textarea></div>`;}
 const F=filtered(),idx=F.findIndex(x=>x.id===b.id);
 M.innerHTML=`<div class="card">${renderBody(b)}</div>
 <div class="card"><div style="display:flex;align-items:center;gap:10px"><b style="font-size:16px">Your review</b>${mineFor(b.id)?`<span class="small muted">last saved ${new Date(mineFor(b.id).at).toLocaleString()}</span>`:""}</div>
  <div class="lbl">Decision</div><div class="seg dec" data-k="decision">${[["approve","Approve"],["minor","Approve with minor edits"],["revise","Needs revision"],["reject","Reject"]].map(([v,t])=>`<button data-v="${v}" class="${DRAFT.decision===v?"on":""}">${t}</button>`).join("")}</div>
  <div class="grid2">${CHECKS.map(([k,t,o])=>`<div><div class="lbl">${t}</div>${seg(k,o)}</div>`).join("")}</div>
  <div class="lbl">Comment</div><textarea id="cm" placeholder="What would you change, and why? Cite Keck policy or a reference if relevant.">${esc(DRAFT.comment)}</textarea>
  <div style="margin-top:8px"><button id="te">${ed?"Remove suggested edit":"✎ Suggest an edit to the text"}</button></div>${edHtml}
  <div class="savebar"><button class="pri" id="sv">Save review</button><button id="svn">Save &amp; next →</button><button class="ghost" id="nx" ${idx<0||idx>=F.length-1?"disabled":""}>Skip →</button><span id="st"></span></div></div>
 <div class="card"><b style="font-size:16px">Other reviewers (${others.length})</b>${others.length?others.map(r=>revCard(b,r)).join(""):`<p class="muted small">No one else has reviewed this yet.</p>`}</div>`;
 M.querySelectorAll(".seg").forEach(s=>s.querySelectorAll("button").forEach(btn=>btn.onclick=()=>{DRAFT[s.dataset.k]=DRAFT[s.dataset.k]===btn.dataset.v?"":btn.dataset.v;show()}));
 $("#cm").oninput=e=>DRAFT.comment=e.target.value;
 $("#te").onclick=()=>{DRAFT.edit=DRAFT.edit?null:editFields(b);show()};
 M.querySelectorAll("[data-e]").forEach(el=>el.oninput=()=>{const k=el.dataset.e;if(k==="opt")DRAFT.edit.opts[+el.dataset.i]=el.value;else DRAFT.edit[k]=el.value});
 const doSave=async next=>{if(!DRAFT.decision){$("#st").innerHTML=`<span class="err">Pick a decision first.</span>`;return}
  const p=Object.assign({},DRAFT);delete p._id;$("#st").textContent="Saving…";
  try{await rpc("mst_rev_save",{p_code:CODE,p_item:b.id,p_name:ME.name,p_email:ME.email,p_payload:p});await refresh();nav();list();
   if(next&&idx<F.length-1){SEL=F[idx+1].id;DRAFT=null;list();show();$("#main").scrollTop=0;toast("Saved ✓ "+b.id)}else{show();$("#st").innerHTML=`<span class="saved">Saved ✓</span>`}}
  catch(e){$("#st").innerHTML=`<span class="err">Not saved: ${esc(e.message)}. Your text is still here; try again.</span>`}};
 $("#sv").onclick=()=>doSave(false);$("#svn").onclick=()=>doSave(true);
 $("#nx").onclick=()=>{SEL=F[idx+1].id;DRAFT=null;list();show();$("#main").scrollTop=0};}
function diffItem(b,e){const d=b.data,out=[];if(b.kind==="item"){if(e.stem!==d.stem)out.push(["Stem",d.stem,e.stem]);e.opts.forEach((o,i)=>{if(o!==d.opts[i])out.push(["Option "+L[i],d.opts[i],o])});if(e.key!==d.key)out.push(["Key",d.key,e.key]);if(e.why!==d.why)out.push(["Why",d.why,e.why]);}
 else if(b.kind==="case"){if(e.text)out.push(["Rewrite","",e.text])}else{if(e.task!==d.task)out.push(["Task",d.task,e.task]);if(e.rubric!==d.rubric.join("\n"))out.push(["Rubric",d.rubric.join(" / "),e.rubric.split("\n").join(" / ")]);if(e.critical!==d.critical.join("\n"))out.push(["Critical fails",d.critical.join(" / "),e.critical.split("\n").join(" / ")]);}
 return out;}
function revCard(b,r){const p=r.p,dl=p.edit?diffItem(b,p.edit):[];
 return `<div class="rev"><div class="h"><b>${esc(r.name)}</b>${p.decision?`<span class="pill p-${p.decision}">${({approve:"Approve",minor:"Approve w/ minor edits",revise:"Needs revision",reject:"Reject"})[p.decision]}</span>`:""}<span class="muted">${new Date(r.at).toLocaleDateString()}</span></div>
 <div class="small muted" style="margin-top:4px">${CHECKS.filter(([k])=>p[k]).map(([k,t])=>`${t.replace("?","")}: <b style="color:${p[k]==="No"?"var(--bad)":"inherit"}">${esc(p[k])}</b>`).join(" · ")}</div>
 ${p.comment?`<div style="margin-top:6px">${esc(p.comment)}</div>`:""}${dl.length?`<div class="diff">${dl.map(([f,a,c])=>`<div><b>${f}:</b> ${a?`<del>${esc(a)}</del> → `:""}<ins>${esc(c)}</ins></div>`).join("")}</div>`:""}</div>`;}
// ───────── suggest ─────────
function vSuggest(){$("#app").innerHTML=`<div class="main" style="max-width:1100px;margin:0 auto"><div class="card"><b style="font-size:17px">Suggest something new</b><p class="muted small">A topic we're missing, a question you'd ask, a hands-on skill, or general feedback on the bank or the game.</p>
 <div class="grid2"><div><div class="lbl">Type</div><select id="st_t"><option value="topic">Topic / content gap</option><option value="question">New question</option><option value="skill">New hands-on skill</option><option value="feedback">General feedback</option></select></div>
 <div><div class="lbl">AKAT focus area</div><select id="st_a"><option value="">(not sure / n/a)</option>${AREAS.map(a=>`<option>${esc(a)}</option>`).join("")}</select></div>
 <div><div class="lbl">Unit</div><select id="st_u"><option>Med-Surg Tele</option><option>PCU</option><option>Both</option></select></div>
 <div><div class="lbl">Short title</div><input id="st_ti" placeholder="e.g., ECMO cannula dislodgement"></div></div>
 <div class="lbl">Details</div><textarea id="st_d" placeholder="What should residents know or be able to do? Why does it matter at Keck?"></textarea>
 <div id="qx"></div><div class="lbl">Reference (optional)</div><input id="st_r" placeholder="Policy number, guideline, article">
 <div class="savebar"><button class="pri" id="st_go">Submit suggestion</button><span id="st_s"></span></div></div>
 <div class="card"><b style="font-size:16px">All suggestions (${SUG.length})</b>${SUG.length?SUG.map(s=>sugCard(s)).join(""):`<p class="muted small">None yet. Be the first.</p>`}</div></div>`;
 const qx=()=>{$("#qx").innerHTML=$("#st_t").value==="question"?`<div class="edit"><div class="lbl">Draft question (rough is fine; the studio will polish it)</div><div class="r"><span class="small muted">Stem</span><textarea id="q_s"></textarea></div>${["A","B","C","D"].map(x=>`<div class="r"><b>${x}</b><input id="q_${x}"></div>`).join("")}
  <div class="r"><span class="small muted">Key</span><input id="q_k" style="max-width:100px"></div><div class="r"><span class="small muted">Why</span><textarea id="q_w"></textarea></div></div>`:""};
 $("#st_t").onchange=qx;qx();
 $("#st_go").onclick=async()=>{const p={type:$("#st_t").value,area:$("#st_a").value,unit:$("#st_u").value,title:$("#st_ti").value.trim(),details:$("#st_d").value.trim(),ref:$("#st_r").value.trim()};
  if(p.type==="question")p.question={stem:$("#q_s").value,opts:["A","B","C","D"].map(x=>$("#q_"+x).value),key:$("#q_k").value.trim().toUpperCase(),why:$("#q_w").value};
  if(!p.title&&!p.details){$("#st_s").innerHTML=`<span class="err">Add a title or some details.</span>`;return}
  $("#st_s").textContent="Sending…";try{await rpc("mst_sugg_save",{p_code:CODE,p_name:ME.name,p_email:ME.email,p_payload:p});await refresh();toast("Suggestion sent ✓");vSuggest()}catch(e){$("#st_s").innerHTML=`<span class="err">Not sent: ${esc(e.message)}</span>`}};}
const TYPES={topic:"Topic / gap",question:"New question",skill:"Hands-on skill",feedback:"Feedback"};
function sugCard(s){const p=s.p,q=p.question;return `<div class="rev"><div class="h"><b>${esc(p.title||TYPES[p.type])}</b><span class="pill p-minor">${TYPES[p.type]||p.type}</span>${p.area?`<span class="chip">${esc(p.area)}</span>`:""}<span class="chip">${esc(p.unit||"")}</span>
 <span class="pill ${s.status==="accepted"?"p-approve":s.status==="declined"?"p-reject":s.status==="done"?"p-approve":"p-revise"}">${esc(s.status)}</span><span class="muted">${esc(s.name)} · ${new Date(s.at).toLocaleDateString()}</span>
 ${ADMIN?`<select data-sid="${s.id}" style="width:auto;margin-left:auto;padding:2px 6px">${["new","accepted","declined","done"].map(x=>`<option ${x===s.status?"selected":""}>${x}</option>`).join("")}</select>`:""}</div>
 ${p.details?`<div style="margin-top:6px">${esc(p.details)}</div>`:""}${q&&q.stem?`<div class="small" style="margin-top:6px"><b>Q:</b> ${esc(q.stem)}<br>${q.opts.map((o,i)=>o?`${L[i]}. ${esc(o)}${q.key===L[i]?" ✓":""}`:"").filter(Boolean).join(" · ")}${q.why?`<br><i>${esc(q.why)}</i>`:""}</div>`:""}${p.ref?`<div class="small muted">Ref: ${esc(p.ref)}</div>`:""}</div>`;}
// ───────── summary ─────────
function vSummary(){const rev=REV,reviewers=[...new Set(rev.map(r=>r.email))];const by=id=>rev.filter(r=>r.item===id);
 const reviewed=BANK.filter(b=>by(b.id).length).length;const tally=k=>rev.filter(r=>r.p.decision===k).length;
 const rows=BANK.map(b=>{const rs=by(b.id);const c=k=>rs.filter(r=>r.p.decision===k).length;return {b,n:rs.length,ap:c("approve")+c("minor"),rv:c("revise"),rj:c("reject"),inacc:rs.filter(r=>r.p.accurate==="No"||r.p.accurate==="Unsure").length,keck:rs.filter(r=>r.p.keck==="No"||r.p.keck==="Unsure").length,edits:rs.filter(r=>r.p.edit).length,last:(rs.filter(r=>r.p.comment).slice(-1)[0]||{p:{}}).p.comment||""}});
 const att=rows.filter(r=>r.rv||r.rj||r.inacc||r.keck);
 $("#app").innerHTML=`<div class="main" style="max-width:1300px;margin:0 auto">
 <div><span class="stat"><b>${reviewed}/${BANK.length}</b>reviewed by anyone</span><span class="stat"><b>${reviewers.length}</b>reviewers</span><span class="stat"><b>${tally("approve")+tally("minor")}</b>approvals</span><span class="stat"><b>${tally("revise")}</b>need revision</span><span class="stat"><b>${tally("reject")}</b>rejects</span><span class="stat"><b>${SUG.length}</b>suggestions</span></div>
 <div class="card"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b style="font-size:16px">Reviewers</b><span class="small muted">${reviewers.map(e=>{const r=rev.find(x=>x.email===e);return `${esc(r.name)} (${rev.filter(x=>x.email===e).length})`}).join(" · ")||"none yet"}</span>
 <span style="margin-left:auto"></span><button id="csv1">⬇ Reviews CSV</button><button id="csv2">⬇ Suggestions CSV</button>${ADMIN?`<span class="small saved">Admin on</span>`:`<input id="adk" placeholder="Admin key" style="width:140px"><button id="adb">Unlock admin</button>`}</div></div>
 <div class="card"><b style="font-size:16px">Needs attention (${att.length})</b><p class="small muted">Any "needs revision", "reject", or a No/Unsure on accuracy or Keck practice.</p>${tbl(att)}</div>
 <div class="card"><b style="font-size:16px">All items</b>${tbl(rows)}</div></div>`;
 document.querySelectorAll("[data-open]").forEach(a=>a.onclick=()=>{SEL=a.dataset.open;DRAFT=null;go("review")});
 $("#csv1").onclick=()=>dl("mst-sme-reviews.csv",[["item","kind","batch","area","reviewer","email","decision","accurate","keck","difficulty","distractors","comment","suggested_edit","saved_at"],...REV.map(r=>{const b=BANK.find(x=>x.id===r.item)||{data:{}};const e=r.p.edit?diffItem(b,r.p.edit).map(([f,a,c])=>`${f}: ${c}`).join(" | "):"";return [r.item,b.kind,b.batch,b.data.area,r.name,r.email,r.p.decision,r.p.accurate,r.p.keck,r.p.difficulty,r.p.distractors,r.p.comment,e,r.at]})]);
 $("#csv2").onclick=()=>dl("mst-sme-suggestions.csv",[["type","title","area","unit","details","question","reference","by","email","status","at"],...SUG.map(s=>{const p=s.p,q=p.question;return [TYPES[p.type],p.title,p.area,p.unit,p.details,q&&q.stem?`${q.stem} | ${q.opts.map((o,i)=>L[i]+". "+o).join(" | ")} | Key ${q.key} | ${q.why}`:"",p.ref,s.name,s.email,s.status,s.at]})]);
 const adb=$("#adb");if(adb)adb.onclick=async()=>{const k=$("#adk").value.trim();try{if(await rpc("mst_rev_admin",{p_code:CODE,p_admin:k})){ADMIN=k;toast("Admin unlocked: set suggestion status on the Suggest tab");vSummary()}else toast("Wrong admin key")}catch(e){toast(e.message)}};
 document.querySelectorAll("[data-sid]").forEach(s=>s.onchange=async()=>{await rpc("mst_sugg_status",{p_code:CODE,p_admin:ADMIN,p_id:s.dataset.sid,p_status:s.value});await refresh();toast("Status updated")});}
function tbl(rows){if(!rows.length)return `<p class="muted small">Nothing here.</p>`;return `<div style="max-height:520px;overflow:auto"><table><tr><th>ID</th><th>Area</th><th>Reviews</th><th>✓</th><th>✎</th><th>✕</th><th>Accuracy flags</th><th>Keck flags</th><th>Edits</th><th>Latest comment</th></tr>
 ${rows.map(r=>`<tr><td><a href="#" data-open="${r.b.id}">${r.b.id}</a></td><td>${esc(r.b.data.area||"")}</td><td>${r.n}</td><td>${r.ap||""}</td><td style="color:var(--warn)">${r.rv||""}</td><td style="color:var(--bad)">${r.rj||""}</td><td style="color:var(--bad)">${r.inacc||""}</td><td style="color:var(--warn)">${r.keck||""}</td><td>${r.edits||""}</td><td class="small">${esc(r.last.slice(0,120))}</td></tr>`).join("")}</table></div>`;}
function dl(name,rows){const csv=rows.map(r=>r.map(v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`).join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"}));a.download=name;a.click();}
// keep the suggest-tab admin dropdown working too
const _vs=vSuggest;vSuggest=function(){_vs();document.querySelectorAll("[data-sid]").forEach(s=>s.onchange=async()=>{try{await rpc("mst_sugg_status",{p_code:CODE,p_admin:ADMIN,p_id:s.dataset.sid,p_status:s.value});await refresh();toast("Status updated")}catch(e){toast(e.message)}})};
setInterval(async()=>{if(CODE&&BANK.length&&VIEW!=="review"){await refresh()}},60000);
(async()=>{load();if(CODE&&ME){try{BANK=await decrypt(CODE);await refresh();go("review");return}catch(e){}}vGate();})();
</script>
</body>
</html>

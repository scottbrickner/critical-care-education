<head>

<style>

header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:#0b0f19}

.qr{background:#fff;padding:10px;border-radius:12px;width:340px}.qr svg{width:100%;height:auto;display:block}
.plist{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.plist .team{min-height:160px}.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);padding:4px 10px;border-radius:999px;margin:3px;font-size:16px}.chip button{padding:0 6px;background:transparent;color:var(--mute)}

async function rpc(fn, args) {
  const r = await fetch(CCR.url + "/rest/v1/rpc/" + fn, {
    method: "POST",
    headers: { apikey: CCR.key, Authorization: "Bearer " + CCR.key, "Content-Type": "application/json" },
    body: JSON.stringify(args || {})
  });
  const t = await r.text();
  let j = null; try { j = t ? JSON.parse(t) : null; } catch (e) { j = t; }
  if (!r.ok) throw new Error((j && j.message) || ("HTTP " + r.status));
  return j;
}
// Certainty-based marking (Gardner-Medwin): right +1/+2/+3, wrong 0/-2/-6 (x tile value)
function scoreAnswer(tile, choice, conf, key, credit) {
  if (!choice) return 0;
  if (tile.type === "judge") return Math.round(tile.value * ((credit && credit[choice]) || 0));
  if (choice === key) return tile.value * conf;
  return conf === 1 ? 0 : conf === 2 ? -2 * tile.value : -6 * tile.value;
}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
const LETTERS = ["A", "B", "C", "D"];

<script>// Synthetic 6-second ECG strips (lead II style) drawn as SVG on standard ECG paper.
function ecgStrip(kind, W, H) {
  W = W || 1000; H = H || 220;
  const secs = 6, fs = 500, pxPerSec = W / secs, mm = pxPerSec / 25; // 25 mm/s
  const base = H * 0.62, pxPerMv = mm * 10;
  const g = (t, c, w, a) => a * Math.exp(-((t - c) * (t - c)) / (2 * w * w));
  const ev = []; // {t, type}
  if (kind === "chb") {
    for (let t = 0.15; t < secs; t += 0.75) ev.push({ t, type: "P" });
    for (let t = 0.55; t < secs; t += 1.667) ev.push({ t, type: "VW" });
  } else if (kind === "vfail") {
    const cap = [1, 1, 0, 0, 1, 0, 1, 1];
    let i = 0;
    for (let t = 0.25; t < secs; t += 0.857, i++) { ev.push({ t, type: "SPIKE" }); if (cap[i]) ev.push({ t: t + 0.02, type: "VP" }); }
  }
  const spikes = [];
  const v = new Float32Array(secs * fs);
  for (let n = 0; n < v.length; n++) {
    const t = n / fs; let y = 0;
    for (const e of ev) {
      const d = t - e.t; if (d < -0.3 || d > 0.7) continue;
      if (e.type === "P") y += g(t, e.t, 0.03, 0.22);
      if (e.type === "VW" || e.type === "VP") { // wide ventricular complex with discordant T
        y += g(t, e.t + 0.04, 0.03, e.type === "VP" ? -0.35 : 0.9);
        y += g(t, e.t + 0.11, 0.035, e.type === "VP" ? -0.9 : -0.35);
        y += g(t, e.t + 0.38, 0.07, e.type === "VP" ? 0.3 : -0.3);
      }
    }
    v[n] = y + 0.01 * Math.sin(2 * Math.PI * 0.3 * t);
  }
  for (const e of ev) if (e.type === "SPIKE") spikes.push(e.t);
  let grid = "";
  for (let x = 0, i = 0; x <= W + 0.1; x += mm, i++) grid += `<line x1="${x.toFixed(1)}" y1="0" x2="${x.toFixed(1)}" y2="${H}" stroke="${i % 5 ? "#f3c6c6" : "#e48f8f"}" stroke-width="${i % 5 ? 0.5 : 1}"/>`;
  for (let y = 0, i = 0; y <= H + 0.1; y += mm, i++) grid += `<line x1="0" y1="${y.toFixed(1)}" x2="${W}" y2="${y.toFixed(1)}" stroke="${i % 5 ? "#f3c6c6" : "#e48f8f"}" stroke-width="${i % 5 ? 0.5 : 1}"/>`;
  let d = "";
  for (let n = 0; n < v.length; n += 2) d += (n ? "L" : "M") + (n / fs * pxPerSec).toFixed(1) + " " + (base - v[n] * pxPerMv).toFixed(1);
  let sp = spikes.map(t => { const x = (t * pxPerSec).toFixed(1); return `<line x1="${x}" y1="${base}" x2="${x}" y2="${base - pxPerMv * 1.6}" stroke="#111" stroke-width="1.6"/>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ECG rhythm strip" style="width:100%;height:auto;background:#fff7f7;border-radius:8px">${grid}<path d="${d}" fill="none" stroke="#111" stroke-width="2" stroke-linejoin="round"/>${sp}<text x="8" y="18" font-family="Arial" font-size="14" fill="#7a2020">II · 25 mm/s · 6 sec</text></svg>`;
}

</script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';

<script>const BANK={"columns":[{"id":"C1","name":"Cardio &\nHemodynamics","short":"Cardio/Hemo"},{"id":"C2","name":"Rhythms &\nPacing","short":"Rhythm/Pace"},{"id":"C3","name":"Pulm, Vent\n& ABGs","short":"Pulm/ABG"},{"id":"C4","name":"Neuro","short":"Neuro"},{"id":"C5","name":"Multisystem","short":"Multisystem"},{"id":"C6","name":"🔧 Hands-On","short":"Hands-On"}],"chains":{"BED4":{"title":"Bed 4 · POD 0 CABG ×3","text":"68-year-old, 4 hours post CABG ×3. Two mediastinal chest tubes. Was stable on arrival from the OR."}},"tiles":[{"id":"C1-100","col":"C1","value":100,"type":"mc","stem":"Which hemodynamic value best reflects LEFT ventricular preload?","opts":["CVP / right atrial pressure","Pulmonary artery occlusion pressure (wedge)","Systemic vascular resistance","Cardiac index"],"why":"PAOP approximates left atrial pressure and LVEDP (absent mitral disease or very high PEEP). CVP is right-sided preload, SVR is afterload, and CI is output."},{"id":"C1-200","col":"C1","value":200,"type":"mc","stem":"Inferior STEMI. BP 78/50, HR 54, clear lungs, JVD. Right-sided lead V4R shows ST elevation. Best initial intervention?","opts":["Sublingual nitroglycerin","IV fluid bolus","IV furosemide","IV morphine for pain"],"why":"RV infarct: the RV is preload-dependent. Give volume. Nitrates, diuretics and morphine all drop preload and can crash the pressure.","debrief":"Which home med on the MAR would you hold, and who do you tell?"},{"id":"C1-300","col":"C1","value":300,"type":"mc","chain":"BED4","stem":"Chest tube output was brisk for 2 hours, then suddenly almost stopped. Look at the numbers. What's most likely going on?","data":[["CT output","250 → 250 → 10 mL/hr"],["HR / BP","128 / 82/64"],["CVP · PAD · PAOP","18 · 19 · 18"],["CI","1.6"]],"opts":["Hypovolemia from bleeding","Cardiac tamponade","Left ventricular failure","Vasoplegia"],"why":"Equalized diastolic pressures (CVP ≈ PAD ≈ PAOP), a sudden stop in chest tube drainage, low CI and a narrow pulse pressure = tamponade. Hypovolemia gives LOW filling pressures. Vasoplegia gives a HIGH CI with low SVR."},{"id":"C1-400","col":"C1","value":400,"type":"mc","chain":"BED4","stem":"Same patient — you suspect tamponade. What is the priority?","opts":["Bolus 1 L crystalloid and reassess in 1 hour","Notify the CT surgeon now and prepare for bedside re-exploration (open-chest setup)","Start dobutamine to improve contractility","Increase PEEP to tamponade the bleeding"],"why":"Post-cardiac-surgery tamponade needs surgical decompression. Volume can bridge for minutes, but it can't delay the call. Inotropes don't fix a compressed heart, and more PEEP lowers venous return further.","debrief":"Walk through your bedside sternotomy setup. Where's the U-drape, who runs the code cart?"},{"id":"C2-100","col":"C2","value":100,"type":"mc","strip":"chb","stem":"Identify this rhythm. (Atrial rate ≈ 80, ventricular rate ≈ 36, wide QRS, PR intervals vary with no pattern.)","opts":["2nd-degree AV block, Mobitz I (Wenckebach)","2nd-degree AV block, Mobitz II","3rd-degree (complete) heart block","Sinus bradycardia with 1st-degree block"],"why":"P waves march through regularly at their own rate, and QRS complexes march at a slower, wide escape rate. No P is conducted, so this is AV dissociation = complete heart block."},{"id":"C2-200","col":"C2","value":200,"type":"mc","strip":"vfail","stem":"POD 1 valve patient, VVI via epicardial wires at 70. Look at the strip: some pacing spikes have no QRS after them. Your FIRST move?","opts":["Increase the sensitivity number (make it less sensitive)","Check every connection, then increase V output (mA) and confirm capture","Switch to AAI","Decrease the rate to 50"],"why":"Spike without a QRS = failure to CAPTURE (output problem), not a sensing problem. Check cable and wire connections, then raise output and confirm a spike → wide QRS → pulse."},{"id":"C2-300","col":"C2","value":300,"type":"judge","stem":"0300. Same patient is pacer-dependent. The V threshold has climbed from 2 mA to 9 mA overnight. Now there's intermittent loss of capture even at 20 mA. You've checked every connection and swapped the cable. What do you do?","opts":["Turn output to max (25 mA) and recheck the threshold at 0700","Call the provider/EP now, put transcutaneous pads on and be ready to pace through them, and anticipate a transvenous wire","Unplug the bridging cable briefly to see the underlying rhythm","Put pads on now, then bring it up at 0600 rounds"],"why":"Unit standard: when device and wire troubleshooting is exhausted, ESCALATE and plan alternative pacing. Don't keep cranking. A climbing threshold means the wires are failing. NEVER unplug the cables on a dependent patient. Pads are right, but waiting until rounds isn't.","debrief":"What makes it hard to call at 0300? Give the SBAR you'd say in 20 seconds."},{"id":"C2-400","col":"C2","value":400,"type":"mc","stem":"Threshold testing on the 5392: V CAPTURE threshold = 3 mA. V SENSING threshold = 4 mV (sense light stops flashing at 4 mV). Per our unit standard, set:","opts":["Output 6 mA · Sensitivity 2 mV","Output 9 mA · Sensitivity 2 mV","Output 6 mA · Sensitivity 8 mV","Output 3 mA · Sensitivity 4 mV"],"why":"Keck trains output at 2× the capture threshold (3 → 6 mA) and sensitivity at ½ or less of the sensing threshold (4 → 2 mV). A lower mV number = MORE sensitive. 3× is the manufacturer's range, but we train to double."},{"id":"C3-100","col":"C3","value":100,"type":"mc","stem":"ABG: pH 7.29 · PaCO₂ 58 · HCO₃ 25. Interpretation?","opts":["Metabolic acidosis","Respiratory acidosis, uncompensated","Respiratory alkalosis","Respiratory acidosis, fully compensated"],"why":"Acidemic pH with a high CO₂ = respiratory acidosis. HCO₃ is normal, so there's no metabolic compensation yet: uncompensated (acute)."},{"id":"C3-200","col":"C3","value":200,"type":"judge","stem":"25 minutes into a spontaneous breathing trial: RR 34, HR up 25 from baseline, diaphoretic, SpO₂ 89%. The team is rushing: \"Looks fine — let's extubate, OR needs the vent.\" You…","opts":["Speak up with the data (\"I'm concerned, he's meeting SBT failure criteria\"), stop the SBT per protocol, and ask for reassessment","Extubate — RT and the provider own airway decisions","Quietly turn up the FiO₂ and let the trial finish","Let it run to 30 minutes, then report what you saw"],"why":"Tachypnea, tachycardia, diaphoresis and desaturation are SBT failure criteria. Speaking up (CUS: Concerned, Uncomfortable, Safety issue) with objective data is the job. Production pressure isn't a clinical indication.","debrief":"What exact words would you use? What if they push back?"},{"id":"C3-300","col":"C3","value":300,"type":"mc","stem":"During an SBT: RR 28, spontaneous tidal volume 350 mL. What's the RSBI, and what does it suggest?","opts":["80: favorable for extubation","9.8: favorable for extubation","80: predicts failure","125: predicts failure"],"why":"RSBI = RR ÷ Vt in LITERS = 28 ÷ 0.35 = 80. Under 105 predicts weaning success. It's one data point, so look at the whole patient (mentation, secretions, cough)."},{"id":"C3-400","col":"C3","value":400,"type":"mc","stem":"ARDS on volume A/C: Vt 8 mL/kg PBW, PEEP 12, plateau pressure 34. Which change fits lung-protective ventilation?","opts":["Increase Vt to blow off CO₂","Lower Vt toward 6 mL/kg PBW, target plateau ≤ 30, and accept permissive hypercapnia","Drop PEEP to 5 to lower the plateau","Raise the rate to 40 and leave Vt alone"],"why":"ARDSnet: Vt 4–8 (aim 6) mL/kg predicted body weight, plateau ≤ 30, and driving pressure (Pplat − PEEP) ideally < 15. Here it's 22. Dropping PEEP de-recruits; huge rates cause auto-PEEP."},{"id":"C4-100","col":"C4","value":100,"type":"mc","stem":"Opens eyes to pain, says inappropriate words, withdraws from pain. GCS?","opts":["7","8","9","10"],"why":"E2 (to pain) + V3 (inappropriate words) + M4 (withdraws) = 9."},{"id":"C4-200","col":"C4","value":200,"type":"mc","stem":"Which finding is a LATE sign of rising intracranial pressure?","opts":["Restlessness","Headache","Widened pulse pressure, bradycardia and irregular respirations","Subtle decline in level of consciousness"],"why":"Cushing's triad is a late, pre-herniation finding. A change in LOC is the EARLIEST and most sensitive sign, so don't wait for the triad."},{"id":"C4-300","col":"C4","value":300,"type":"judge","stem":"2 hours after IV thrombolytic for stroke: new severe headache, vomiting, BP 192/104, NIHSS up 3 points. The covering resident says, \"Give ondansetron, recheck in an hour.\" You…","opts":["Give the ondansetron and recheck in 1 hour","Treat it as possible hemorrhage: stat neuro reassessment, stop any thrombolytic, push for a stat head CT and bedside eval, and go up the chain of command if the response doesn't match the risk","Give labetalol per the BP parameters and keep the q1h neuro checks","Document and hand off to the next shift"],"why":"Headache, vomiting, acute hypertension and neuro decline after a thrombolytic = symptomatic ICH until proven otherwise. BP control (post-lytic goal < 180/105) is part of it, but the escalation is the point.","debrief":"Who's the next person you call if the resident doesn't come? Name them for this unit."},{"id":"C4-400","col":"C4","value":400,"type":"mc","stem":"Post transsphenoidal pituitary resection: urine output 400 mL/hr ×2 hr, urine specific gravity 1.002, serum Na 149. Most likely, and what do you anticipate?","opts":["SIADH: fluid restriction","Central diabetes insipidus: desmopressin and replace volume","Cerebral salt wasting: sodium tablets","Mannitol diuresis: hold mannitol"],"why":"Huge dilute urine with rising serum sodium = DI (low ADH). SIADH is the opposite: low output, concentrated urine, LOW sodium."},{"id":"C5-100","col":"C5","value":100,"type":"mc","stem":"DKA. Before you start the insulin infusion, which lab must you know?","opts":["Potassium","Phosphorus","Amylase","Lactate"],"why":"Insulin drives K⁺ into cells. If K⁺ is < 3.3, hold insulin and replace potassium first, or you risk lethal hypokalemia."},{"id":"C5-200","col":"C5","value":200,"type":"judge","stem":"Two alarms at once. Bed 7 (septic): MAP just dropped to 58 on norepinephrine, about 15 mL left in the bag. Bed 8 (stable post-op): call light, pain 7/10. Your coworker is free. Best plan?","opts":["Go to Bed 7, ask your coworker to take Bed 8's pain, get the replacement norepi bag hung before it runs dry, and update the provider on the MAP","Bed 8 first; pain control is a patient right","Go to Bed 7 and titrate up; change the bag when the pump alarms","Call the provider before going to either bed"],"why":"Hemodynamic instability first, delegate what you can, and NEVER let a vasoactive run dry. Have the next bag ready well before the 20 mL mark. Titrating without a bag plan sets up a crash.","debrief":"How do you ask a busy coworker for help so it actually lands?"},{"id":"C5-300","col":"C5","value":300,"type":"mc","stem":"Septic shock: lactate 4.6, MAP 60 after a 30 mL/kg crystalloid bolus. Next step per Surviving Sepsis?","opts":["Start norepinephrine, target MAP ≥ 65","Start dopamine as the first-line vasopressor","Give another 30 mL/kg and wait 2 hours before pressors","Start dobutamine"],"why":"Persistent hypotension after initial fluid → norepinephrine first-line, MAP ≥ 65 (peripheral start is OK while central access is arranged). Recheck lactate. Dopamine causes more arrhythmias."},{"id":"C5-400","col":"C5","value":400,"type":"mc","stem":"POD 7 CABG on heparin. Platelets fell from 240K to 90K, and there's a new DVT. What do you anticipate?","opts":["Continue heparin and transfuse platelets","Stop ALL heparin (flushes and heparin-coated lines too), send PF4/HIT testing, and start a non-heparin anticoagulant (argatroban or bivalirudin)","Stop heparin and start warfarin today","Switch to enoxaparin"],"why":"A > 50% platelet drop at 5–10 days plus a new thrombosis = HIT until proven otherwise. It's prothrombotic, so stop every heparin source and start a direct thrombin inhibitor. Starting warfarin now risks venous limb gangrene, and LMWH cross-reacts."},{"id":"C6-100","col":"C6","value":100,"type":"skill","stem":"Order: dobutamine 5 mcg/kg/min. Weight 70 kg. Bag label: 1,000 mcg/mL. Pump rate?","opts":["2.1 mL/hr","12.6 mL/hr","21 mL/hr","35 mL/hr"],"why":"5 × 70 = 350 mcg/min × 60 = 21,000 mcg/hr ÷ 1,000 mcg/mL = 21 mL/hr.","task":{"title":"Skills lead programs it","where":"Vasoactive sim or a pump with the drug library","items":["Verifies order + concentration against the bag label","Shows an independent calculation","Programs it through the drug library (guardrails on)","States the titration parameters and the bag-change plan"]}},{"id":"C6-200","col":"C6","value":200,"type":"skill","stem":"BP 150/90, ICP 24 mmHg. What's the CPP?","opts":["66 mmHg","86 mmHg","110 mmHg","126 mmHg"],"why":"MAP = (150 + 2×90) ÷ 3 = 110. CPP = MAP − ICP = 110 − 24 = 86. Usual target is CPP 60–70+; ICP > 20–22 needs treatment.","task":{"title":"Skills lead: neuro check on a faculty 'patient'","where":"At the front, faculty plays the patient","items":["Uses central stimulus correctly (trapezius / supraorbital)","Scores E, V and M separately and correctly","Checks pupils: size, shape, reactivity","Reports the change in SBAR"]}},{"id":"C6-300","col":"C6","value":300,"type":"skill","stem":"CO 4.0 L/min, BSA 2.0 m², MAP 70, CVP 10. Calculate the CI and SVR.","opts":["CI 2.0 · SVR 1,200","CI 8.0 · SVR 1,200","CI 2.0 · SVR 15","CI 2.0 · SVR 1,400"],"why":"CI = CO ÷ BSA = 2.0. SVR = (MAP − CVP) ÷ CO × 80 = 60 ÷ 4 × 80 = 1,200 dynes·s/cm⁵ (normal ~800–1,200).","task":{"title":"Skills lead: level, zero and read","where":"Hemodynamic sim / monitor with a transducer","items":["Levels the transducer at the phlebostatic axis (4th ICS, ½ AP diameter)","Opens to air and zeros","Reads PA and CVP at end-expiration","Tells a PA waveform from a wedge tracing"]}},{"id":"C6-400","col":"C6","value":400,"type":"skill","stem":"DDD pacing. A capture threshold 2 mA, V capture threshold 4 mA. Per our unit standard, set the A and V outputs to:","opts":["A 4 mA · V 8 mA","A 6 mA · V 12 mA","A 2 mA · V 4 mA","A 10 mA · V 20 mA"],"why":"We train to 2× the capture threshold: A 2 → 4 mA, V 4 → 8 mA. Tighter margins catch a rising threshold sooner and save the battery.","task":{"title":"Skills lead on the 5392","where":"Real 5392 or the pacemaker sim (as in this morning's station)","items":["Confirms backup: pads/defib available, patient on monitor","Finds the V capture threshold (output down until capture is lost)","Sets output at 2× and confirms capture (spike → QRS → pulse)","Checks the underlying rhythm safely (step the rate down or PAUSE — never unplug the cables)"]}}],"final":{"id":"FINAL","col":"FINAL","value":500,"type":"mc","stem":"FINAL · POD 2 AVR, now febrile and hypotensive. Read the PA catheter numbers. What kind of shock, and what's the first-line move?","data":[["Temp / HR","39.1 °C · AF 118"],["BP","84/40"],["CI · SVR · CVP","4.1 · 520 · 6"],["Lactate","5.0"]],"opts":["Cardiogenic: start dobutamine","Distributive (likely septic): reassess volume, start norepinephrine, cultures, then antibiotics within the hour","Hypovolemic: volume only","Obstructive: prepare for pericardiocentesis"],"why":"High CI with a very low SVR = distributive. Fever + lactate points to sepsis. Volume to responsiveness, norepinephrine to MAP ≥ 65, cultures, then antibiotics fast. Cardiogenic = LOW CI and high SVR.","debrief":"What's the one thing from today you'll look up again before the exam?"}};</script>
<script>
// ───────────────────────── host state ─────────────────────────
const KEYS = JSON.parse(atob("fX1sbHVuOiJyYyIsIkIiOiJrIns6IkxBTklGIix9bGx1bjoicmMiLCJBIjoiayJ7OiIwMDQtNkMiLH1sbHVuOiJyYyIsIkEiOiJrIns6IjAwMy02QyIsfWxsdW46InJjIiwiQiI6ImsiezoiMDAyLTZDIix9bGx1bjoicmMiLCJDIjoiayJ7OiIwMDEtNkMiLH1sbHVuOiJyYyIsIkIiOiJrIns6IjAwNC01QyIsfWxsdW46InJjIiwiQSI6ImsiezoiMDAzLTVDIix9fTA6IkQiLDUuMDoiQyIsMDoiQiIsMToiQSJ7OiJyYyIsIkEiOiJrIns6IjAwMi01QyIsfWxsdW46InJjIiwiQSI6ImsiezoiMDAxLTVDIix9bGx1bjoicmMiLCJCIjoiayJ7OiIwMDQtNEMiLH19MDoiRCIsNS4wOiJDIiwxOiJCIiwwOiJBIns6InJjIiwiQiI6ImsiezoiMDAzLTRDIix9bGx1bjoicmMiLCJDIjoiayJ7OiIwMDItNEMiLH1sbHVuOiJyYyIsIkMiOiJrIns6IjAwMS00QyIsfWxsdW46InJjIiwiQiI6ImsiezoiMDA0LTNDIix9bGx1bjoicmMiLCJBIjoiayJ7OiIwMDMtM0MiLH19NTIuMDoiRCIsMDoiQyIsMDoiQiIsMToiQSJ7OiJyYyIsIkEiOiJrIns6IjAwMi0zQyIsfWxsdW46InJjIiwiQiI6ImsiezoiMDAxLTNDIix9bGx1bjoicmMiLCJBIjoiayJ7OiIwMDQtMkMiLH19NS4wOiJEIiwwOiJDIiwxOiJCIiwwOiJBIns6InJjIiwiQiI6ImsiezoiMDAzLTJDIix9bGx1bjoicmMiLCJCIjoiayJ7OiIwMDItMkMiLH1sbHVuOiJyYyIsIkMiOiJrIns6IjAwMS0yQyIsfWxsdW46InJjIiwiQiI6ImsiezoiMDA0LTFDIix9bGx1bjoicmMiLCJCIjoiayJ7OiIwMDMtMUMiLH1sbHVuOiJyYyIsIkIiOiJrIns6IjAwMi0xQyIsfWxsdW46InJjIiwiQiI6ImsiezoiMDAxLTFDIns=").split("").reverse().join("")); // light obfuscation of the answer key
const ALL = [...BANK.tiles, BANK.final];
const T = id => ALL.find(t => t.id === id);
const colName = id => id === "FINAL" ? "Final" : BANK.columns.find(c => c.id === id).short;
const LS = "ccr_host_v1";
let S = load() || fresh();
let poll = null, tick = null;
function fresh() { return { code: null, hostKey: null, online: false, view: "setup", teams: ["A", "B", "C"], players: [], answers: [], played: {}, roleRound: 0, sinceRotate: 0, timerDefault: 60, current: null, phase: null, endsAt: 0, playBase: CCR.playBase, seq: 0 }; }
function load() { try { return JSON.parse(localStorage.getItem(LS)); } catch (e) { return null; } }
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { } }
function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 2600); }
function key(id) { return KEYS[id].k; } function credit(id) { return KEYS[id].cr; }
let netState = "";
function setNet(s) { netState = s; hdr(); }
function hdr() {
  const h = document.getElementById("hdrCode");
  if (!S.code && !S.online) { h.innerHTML = S.view === "setup" ? "" : `<span class="muted">Offline · paddle mode</span>`; return; }
  h.innerHTML = `<span class="net ${netState}"></span><span>Join at <b style="font-size:15px;letter-spacing:0;color:var(--ink);font-family:inherit">${esc(shortUrl())}</b></span><span>code</span><b>${S.code}</b>`;
}
function shortUrl() { return S.playBase.replace(/^https?:\/\//, "").replace(/\/play\.html$/, "/play"); }
function joinUrl() { return S.playBase + "?c=" + S.code; }
async function push(extra) {
  if (!S.online) return;
  S.seq++;
  const st = Object.assign({ seq: S.seq, teams: S.teams, roles: rolesMap() }, extra);
  try { await rpc("ccr_set_state", { p_code: S.code, p_host_key: S.hostKey, p_state: st }); setNet("on"); }
  catch (e) { setNet("err"); toast("Couldn't reach the server. Phones may lag. Manual scoring still works."); }
}
async function pull() {
  if (!S.online) return;
  try { const d = await rpc("ccr_host_data", { p_code: S.code, p_host_key: S.hostKey }); S.players = d.players || []; S.answers = d.answers || []; setNet("on"); save(); }
  catch (e) { setNet("err"); }
}
function startPoll(ms) { stopPoll(); poll = setInterval(async () => { await pull(); refreshLive(); }, ms || 2000); }
function stopPoll() { if (poll) clearInterval(poll); poll = null; }
function members(team) { return S.players.filter(p => p.team === team); }
function rolesMap() {
  const m = {};
  S.teams.forEach(tm => { const ms = members(tm); const n = ms.length; if (!n) return;
    CCR.roles.forEach((r, i) => { if (i < n) { const p = ms[(S.roleRound + i) % n]; m[p.id] = r; } }); });
  return m;
}
function rolesText(tm) { const m = rolesMap(); return members(tm).filter(p => m[p.id]).map(p => `${m[p.id]}: <b>${esc(p.nick)}</b>`).join(" · "); }

// ───────────────────────── scoring ─────────────────────────
function ansFor(tile) { return S.answers.filter(a => a.t === tile); }
function teamTilePts(tileId, tm) {
  const t = T(tileId), P = S.played[tileId] || {};
  let base = 0;
  const man = P.manual && P.manual[tm];
  if (man && man.c) base = scoreAnswer(t, man.c, man.k || 1, key(tileId), credit(tileId));
  else {
    const ms = members(tm); if (ms.length) {
      const A = ansFor(tileId); let sum = 0;
      ms.forEach(p => { const a = A.find(x => x.p === p.id); if (a) sum += scoreAnswer(t, a.c, a.k, key(tileId), credit(tileId)); });
      base = Math.round(sum / ms.length);
    }
  }
  let bonus = 0;
  if (t.task && P.checks && P.checks[tm]) bonus = Math.round(t.value * P.checks[tm].filter(Boolean).length / t.task.items.length);
  return { base, bonus, total: base + bonus };
}
function totals() { const o = {}; S.teams.forEach(tm => o[tm] = 0); Object.keys(S.played).forEach(id => { const P = S.played[id]; if (P.pts) S.teams.forEach(tm => o[tm] += (P.pts[tm] || 0)); }); return o; }

// ───────────────────────── views ─────────────────────────
const app = document.getElementById("app");
function go(v) { S.view = v; save(); render(); }
function render() {
  hdr(); clearInterval(tick); tick = null;
  ({ setup: vSetup, lobby: vLobby, board: vBoard, q: vQ, report: vReport, faculty: vFaculty })[S.view]();
}
function vSetup() {
  stopPoll();

function publicTile(t) {
  const ch = t.chain ? BANK.chains[t.chain] : null;
  return { tile: t.id, value: t.value, type: t.type, cat: colName(t.col), stem: t.stem, opts: t.opts, data: t.data || null, visual: !!t.strip, chainTitle: ch ? ch.title : null, chainText: ch ? ch.text : null };
}
async function openTile(id) {
  const t = T(id); const P = S.played[id];
  if (P && P.done) { if (!confirm("This tile was already played. Re-open it? (Phones will answer again; scores get recalculated.)")) return; }
  S.played[id] = Object.assign({ manual: {}, checks: {} }, P || {}, { done: false });
  S.current = id; S.phase = "open";
  const dur = S.timerDefault + (t.type === "skill" ? 30 : 0) + (id === "FINAL" ? 30 : 0);
  S.endsAt = Date.now() + dur * 1000; save();
  await push(Object.assign({ phase: "open", dur }, publicTile(t)));
  go("q");
}
async function lockTile() { S.phase = "locked"; save(); await push(Object.assign({ phase: "locked" }, publicTile(T(S.current)))); await pull(); render(); }
async function revealTile() {
  await pull();

  P.pts = {}; S.teams.forEach(tm => P.pts[tm] = teamTilePts(id, tm).total);
  P.done = true; S.phase = "reveal"; S.sinceRotate++; save();
  await push({ phase: "reveal", tile: id, cat: colName(t.col), value: t.value, type: t.type, key: key(id), credit: credit(id) || null, why: t.why, stem: t.stem, opts: t.opts, teamPts: P.pts, totals: totals() });
  render();
}

function scoredAnswers() { // individual answers on played, non-judgment tiles
  return S.answers.filter(a => { const t = T(a.t); return t && t.type !== "judge" && S.played[a.t] && S.played[a.t].done; })
    .map(a => Object.assign({ ok: a.c === key(a.t), team: (S.players.find(p => p.id === a.p) || {}).team }, a));
}

  const haz = S.teams.map(tm => { const a = SA.filter(x => x.team === tm); const h = a.filter(x => x.k === 3 && !x.ok).length; return { tm, n: a.length, h, pct: a.length ? Math.round(h / a.length * 100) : 0 }; });
  const tiles = [...new Set(SA.map(x => x.t))].map(id => { const a = SA.filter(x => x.t === id); const cw = a.filter(x => !x.ok && x.k >= 2); const wrongs = {}; cw.forEach(x => wrongs[x.c] = (wrongs[x.c] || 0) + 1);
    const top = Object.keys(wrongs).sort((p, q) => wrongs[q] - wrongs[p])[0]; return { id, n: a.length, cw: cw.length, top, acc: Math.round(a.filter(x => x.ok).length / a.length * 100) }; })
    .filter(x => x.cw > 0).sort((p, q) => q.cw - p.cw).slice(0, 6);
  const cats = [...BANK.columns.map(c => c.id), "FINAL"].map(cid => { const a = SA.filter(x => T(x.t).col === cid); return { cid, n: a.length, acc: a.length ? Math.round(a.filter(x => x.ok).length / a.length * 100) : null, haz: a.filter(x => x.k === 3 && !x.ok).length }; }).filter(x => x.n);
  const judges = BANK.tiles.filter(t => t.type === "judge" && S.played[t.id] && S.played[t.id].done).map(t => { const a = S.online ? ansFor(t.id) : Object.values(S.played[t.id].manual || {}).filter(m => m.c); return { t, n: a.length, best: a.filter(x => x.c === key(t.id)).length }; });
  const bar = (pct, col) => `<div class="t"><i style="width:${pct || 0}%;background:${col}"></i></div>`;
  app.innerHTML = `<div class="row"><div class="big grow" style="font-weight:800">📊 Calibration report</div>
    <button id="bB">← Board</button>${S.online ? `<button class="ghost" id="bF">Faculty view (individual)</button>` : ""}<button class="ghost" id="bCsv">Download CSV</button><button class="gold" id="bEnd">End game → send results to phones</button></div>
  <div class="scores" style="grid-template-columns:repeat(${S.teams.length},1fr)">${S.teams.map(tm => `<div class="team" style="border-color:${CCR.teams[tm].color}"><b>Group ${tm}</b><div class="pts">${fmt(tot[tm])}</div></div>`).join("")}</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">
   <div class="panel"><div style="font-weight:800;font-size:20px">Does our confidence match our accuracy?</div><div class="muted" style="font-size:14px">% correct at each confidence level (cohort, ${SA.length} ${S.online ? "individual" : "team"} answers; judgment tiles excluded)</div>
    <div class="bars">${byConf.map(b => `<div class="b"><span>${CCR.conf[b.c].label} <span class="muted">(${b.n})</span></span>${bar(b.pct, ["", "#7f8db5", "#c8a64a", "#ff7a59"][b.c])}<b>${b.pct == null ? "–" : b.pct + "%"}</b></div><div class="muted" style="font-size:12px;margin:-4px 0 6px 160px">${ideal[b.c]}</div>`).join("")}</div></div>
   <div class="panel"><div style="font-weight:800;font-size:20px">⚠ Hazardous misconceptions</div><div class="muted" style="font-size:14px">"Certain" AND wrong: the answers most likely to reach a patient</div>
    <div class="bars">${haz.map(h => `<div class="b"><span style="color:${CCR.teams[h.tm].color};font-weight:800">Group ${h.tm}</span>${bar(h.pct * 3, "#ff5d5d")}<b>${h.h} <span class="muted" style="font-weight:400">(${h.pct}%)</span></b></div>`).join("")}</div></div>
   <div class="panel"><div style="font-weight:800;font-size:20px">🎯 Re-teach before the exam</div><div class="muted" style="font-size:14px">Tiles with the most confident (fairly sure or certain) wrong answers</div>
    ${tiles.length ? `<table><tr><th>Tile</th><th>Topic</th><th>% right</th><th>Confident-wrong</th><th>Top wrong pick</th></tr>${tiles.map(x => { const t = T(x.id); return `<tr><td>${esc(colName(t.col))} ${t.value}</td><td>${esc(t.stem.slice(0, 70))}…</td><td>${x.acc}%</td><td><b style="color:var(--bad)">${x.cw}</b></td><td>${x.top}. ${esc(t.opts[LETTERS.indexOf(x.top)].slice(0, 40))}</td></tr>`; }).join("")}</table>` : `<p class="muted">No confident-wrong answers yet 🎉</p>`}</div>
   <div class="panel"><div style="font-weight:800;font-size:20px">By system</div>
    <table><tr><th>Category</th><th>% correct</th><th>Certain-wrong</th></tr>${cats.map(c => `<tr><td>${esc(colName(c.cid))}</td><td>${c.acc}%</td><td>${c.haz}</td></tr>`).join("")}</table>
    ${judges.length ? `<div style="font-weight:800;margin-top:12px">⚖ Judgment calls: chose the best action</div><table>${judges.map(j => `<tr><td>${esc(colName(j.t.col))} ${j.t.value}</td><td>${j.n ? Math.round(j.best / j.n * 100) + "%" : "–"} <span class="muted">(${j.best}/${j.n})</span></td></tr>`).join("")}</table>` : ""}</div>
  </div>`;
  document.getElementById("bB").onclick = () => go("board");
  const f = document.getElementById("bF"); if (f) f.onclick = () => go("faculty");
  document.getElementById("bCsv").onclick = csv;
  document.getElementById("bEnd").onclick = async () => { await push({ phase: "end", totals: totals(), keys: Object.fromEntries(Object.keys(S.played).filter(id => S.played[id].done).map(id => [id, { k: key(id), cr: credit(id) || null, value: T(id).value, type: T(id).type, cat: colName(T(id).col), stem: T(id).stem }])) }); toast(S.online ? "Personal results sent to phones" : "Game ended"); };
}
function vFaculty() {
  const rows = S.players.map(p => { const a = S.answers.filter(x => x.p === p.id && T(x.t) && T(x.t).type !== "judge" && S.played[x.t] && S.played[x.t].done); const ok = a.filter(x => x.c === key(x.t)).length;
    const hz = a.filter(x => x.k === 3 && x.c !== key(x.t)).length; const mc = a.length ? (a.reduce((s, x) => s + x.k, 0) / a.length) : 0;
    const miss = a.filter(x => x.c !== key(x.t) && x.k >= 2).map(x => colName(T(x.t).col) + " " + T(x.t).value);
    const acc = a.length ? Math.round(ok / a.length * 100) : null; const expected = a.length ? Math.round(a.reduce((s, x) => s + [0, 50, 75, 95][x.k], 0) / a.length) : null;
    return { p, n: a.length, acc, hz, mc, gap: acc == null ? null : expected - acc, miss }; });
  app.innerHTML = `<div class="row"><div class="big grow" style="font-weight:800">Faculty view: individual calibration</div><button id="bR">← Report</button></div>
  <div class="warn" style="margin:10px 0">Not for the projector. This is for coaching conversations. Gap = how much more confident they were than accurate (positive = overconfident).</div>
  <div class="panel"><table><tr><th>Nickname</th><th>Group</th><th>Answered</th><th>% correct</th><th>Avg conf</th><th>Overconfidence gap</th><th>Certain-wrong</th><th>Confident misses (review these)</th></tr>
  ${rows.sort((a, b) => b.hz - a.hz).map(r => `<tr><td>${esc(r.p.nick)}</td><td>${r.p.team}</td><td>${r.n}</td><td>${r.acc == null ? "–" : r.acc + "%"}</td><td>${r.mc ? r.mc.toFixed(1) : "–"}</td><td>${r.gap == null ? "–" : (r.gap > 0 ? "+" : "") + r.gap}</td><td style="color:${r.hz ? "var(--bad)" : "inherit"};font-weight:700">${r.hz}</td><td class="muted">${esc(r.miss.join(", "))}</td></tr>`).join("")}</table></div>`;
  document.getElementById("bR").onclick = () => go("report");
}
function csv() {
  const L = [["game", "nickname", "group", "tile", "category", "value", "type", "choice", "confidence", "correct_key", "correct", "points"]];
  S.answers.forEach(a => { const p = S.players.find(x => x.id === a.p) || {}; const t = T(a.t); if (!t) return;
    L.push([S.code, p.nick, p.team, a.t, colName(t.col), t.value, t.type, a.c, a.k, key(a.t), a.c === key(a.t) ? 1 : 0, scoreAnswer(t, a.c, a.k, key(a.t), credit(a.t))]); });
  Object.keys(S.played).forEach(id => { const P = S.played[id], t = T(id); Object.keys(P.manual || {}).forEach(tm => { const m = P.manual[tm]; if (m.c) L.push([S.code || "offline", "(paddle)", tm, id, colName(t.col), t.value, t.type, m.c, m.k, key(id), m.c === key(id) ? 1 : 0, scoreAnswer(t, m.c, m.k, key(id), credit(id))]); }); });
  const blob = new Blob([L.map(r => r.map(v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`).join(",")).join("\n")], { type: "text/csv" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `ccc-final-review-${S.code || "offline"}-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
}
if (S.online && S.code) { pull().then(render); } else render();
</script>
